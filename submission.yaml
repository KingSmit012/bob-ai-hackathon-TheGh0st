submission:
  title: "Threat Intel Correlation & Alert Prioritisation Assistant"

  problem_statement: >
    Defence analysts receive thousands of security alerts daily from SIEM systems,
    IDS sensors, firewalls, email gateways, and threat intelligence feeds. Over 90%
    are false positives, but missing a real threat is catastrophic. Manual triage
    takes 45-90 minutes per incident and doesn't scale.

  solution_summary: >
    A Python-based pipeline that ingests multi-source security alerts, correlates
    them into incidents using rule-based IP/time-window grouping, classifies each
    as genuine threat or false positive using IBM watsonx.ai (Granite model), maps
    threats to MITRE ATT&CK techniques, and generates ranked BLUF intelligence
    summaries for defence decision-makers.

  key_features:
    - "Multi-source alert ingestion with format normalisation (SIEM, IDS, firewall, email gateway, threat intel)"
    - "Rule-based correlation engine grouping alerts into incidents by IP pairs and time windows"
    - "LLM-powered threat classification via IBM watsonx.ai Granite model with confidence scoring"
    - "Hybrid keyword + LLM MITRE ATT&CK technique mapping"
    - "BLUF (Bottom Line Up Front) intelligence summary generation for decision-makers"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "Click"]
    ibm_technologies: ["watsonx.ai", "IBM Granite Model"]
    databases: []
    other: ["Anthropic Claude (fallback LLM)", "Pandas", "python-dotenv"]

  what_we_are_most_proud_of: >
    The LLM integration is genuinely load-bearing — watsonx.ai Granite performs
    the actual threat reasoning, MITRE technique selection, and BLUF summary
    writing. The prompt templates are transparent, tunable, and handle real-world
    LLM output messiness with robust JSON parsing fallbacks.

  known_limitations: >
    Uses synthetic alerts only (not real SOC data). LLM latency means ~2-5 min
    for full pipeline. MITRE ATT&CK subset is 30 of 600+ techniques. No persistent
    storage — each run processes from scratch. Correlation heuristics tuned for
    our synthetic data.

